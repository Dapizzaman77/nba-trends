<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Player Trends</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e1e5ec;
    --accent: #1f3864; --pos: #0b7a3b; --neg: #b3261e; --posbg: #dff3e6; --negbg: #fbe3e1;
    --head: #1f3864; --headink: #ffffff; --hover: #f0f3f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #171c25; --ink: #e8ebf1; --muted: #98a2b3; --line: #2a3140;
      --accent: #7aa2ff; --pos: #5fd08a; --neg: #ff8a80; --posbg: #12331f; --negbg: #3a1815;
      --head: #243252; --headink: #f3f6fb; --hover: #1d2430;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
  .controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; }
  input[type=search] { min-width: 200px; }
  input[type=number] { width: 64px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { font: inherit; color: var(--muted); background: none; border: 0; padding: 7px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--headink); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg button[aria-pressed=true] { color: #0f1218; } }
  .note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; color: var(--muted); }
  .tablebox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 76vh; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 860px; }
  th, td { padding: 7px 9px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--headink); font-weight: 600;
       font-size: 12px; cursor: pointer; user-select: none; }
  th.trend { background: #4a5260; }
  th .arrow { opacity: .85; margin-left: 3px; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--card); }
  th:first-child { z-index: 3; background: var(--head); }
  tbody tr.player { cursor: pointer; }
  tbody tr.player:hover td { background: var(--hover); }
  td.name { font-weight: 600; }
  .team { color: var(--muted); font-size: 12px; }
  .pos { color: var(--pos); font-weight: 600; } .neg { color: var(--neg); font-weight: 600; } .zero { color: var(--muted); }
  .chip { display: inline-block; min-width: 62px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .chip.HOT { background: var(--posbg); color: var(--pos); } .chip.COLD { background: var(--negbg); color: var(--neg); }
  .chip.STEADY, .chip.na { color: var(--muted); border: 1px solid var(--line); }
  tr.detail td { background: var(--bg); padding: 10px 14px 14px; text-align: left; white-space: normal; }
  .detail table { min-width: 0; width: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .detail th { position: static; background: var(--head); cursor: default; }
  .detail th:first-child, .detail td:first-child { position: static; text-align: center; }
  .detail h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NBA Player Trends</h1>
  <p class="sub" id="meta">Loading...</p>

  <div class="controls">
    <input type="search" id="q" placeholder="Search player" aria-label="Search player">
    <label>Team <select id="team"><option value="">All</option></select></label>
    <label>Min GP <select id="mingp"><option>1</option><option>3</option><option>5</option><option>10</option></select></label>
    <div class="seg" role="group" aria-label="Averages window" id="win">
      <button data-w="season" aria-pressed="true">Season</button>
      <button data-w="l10" aria-pressed="false">Last 10</button>
      <button data-w="l5" aria-pressed="false">Last 5</button>
    </div>
    <label>Hot/Cold at &plusmn; <input type="number" id="thr" min="0" step="0.5" aria-label="Hot or cold threshold in PRA"> PRA</label>
  </div>

  <div id="banner"></div>
  <div class="tablebox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <p class="foot">
    PRA = points + rebounds + assists. Trend columns compare the last-5 average with the season (or last-10) average.
    FG% is made / attempted over the window. Click a player to see their game log. Games with fewer than 5 or 10 played use what exists.
  </p>
</div>

<script src="data/gamelog.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const LOG = window.NBA_LOG;
  if (!LOG || !LOG.rows) {
    $('#meta').textContent = 'Data file not found (data/gamelog.js).';
    return;
  }

  const STATS = [['pts','PTS'],['reb','REB'],['ast','AST'],['tpm','3PM'],['stl','STL'],['blk','BLK'],['tov','TOV'],['pra','PRA']];
  const state = { win: 'season', sort: 'pts', dir: -1, q: '', team: '', minGp: 1, thr: 3, open: new Set() };
  try { const t = parseFloat(localStorage.getItem('nba_thr')); if (!isNaN(t)) state.thr = t; } catch (e) {}

  const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
  function agg(rows) {
    const o = { n: rows.length };
    STATS.forEach(([k]) => { o[k] = rows.length ? sum(rows, k) / rows.length : 0; });
    const fga = sum(rows, 'fga');
    o.fg = fga ? sum(rows, 'fgm') / fga : 0;
    return o;
  }

  const by = new Map();
  LOG.rows.forEach((r) => {
    const row = Object.assign({}, r, { pra: r.pts + r.reb + r.ast });
    if (!by.has(r.p)) by.set(r.p, []);
    by.get(r.p).push(row);
  });
  const players = [...by].map(([name, rows]) => {
    rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    const p = { name, team: rows[rows.length - 1].t, gp: rows.length, rows,
                season: agg(rows), l10: agg(rows.slice(-10)), l5: agg(rows.slice(-5)) };
    p.d_pts = p.l5.pts - p.season.pts;
    p.d_pra = p.l5.pra - p.season.pra;
    p.d_pra10 = p.l5.pra - p.l10.pra;
    return p;
  });
  const flagOf = (p) => p.gp < 3 ? 'n/a' : p.d_pra >= state.thr ? 'HOT' : p.d_pra <= -state.thr ? 'COLD' : 'STEADY';
  const FLAG_ORDER = { HOT: 3, STEADY: 2, COLD: 1, 'n/a': 0 };

  const COLS = [
    { k: 'name', label: 'Player' }, { k: 'team', label: 'Team' }, { k: 'gp', label: 'GP' },
    ...STATS.map(([k, l]) => ({ k, label: l, stat: true })),
    { k: 'fg', label: 'FG%', stat: true },
    { k: 'd_pts', label: 'PTS L5 vs Szn', trend: true },
    { k: 'd_pra', label: 'PRA L5 vs Szn', trend: true },
    { k: 'd_pra10', label: 'PRA L5 vs L10', trend: true },
    { k: 'flag', label: 'Form', trend: true },
  ];

  function el(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) Object.keys(props).forEach((k) => { if (k === 'class') e.className = props[k]; else e[k] = props[k]; });
    (kids || []).forEach((c) => e.append(c));
    return e;
  }
  const delta = (v) => {
    const r = Math.round(v * 10) / 10;
    return el('span', { class: r > 0 ? 'pos' : r < 0 ? 'neg' : 'zero', textContent: (r > 0 ? '+' : '') + r.toFixed(1) });
  };

  function value(p, k) {
    if (k === 'name' || k === 'team') return p[k];
    if (k === 'gp') return p.gp;
    if (k.startsWith('d_')) return p[k];
    if (k === 'flag') return FLAG_ORDER[flagOf(p)];
    return p[state.win][k];
  }

  function cell(p, c) {
    if (c.k === 'name') return el('td', { class: 'name', textContent: p.name });
    if (c.k === 'team') return el('td', { class: 'team', textContent: p.team });
    if (c.k === 'gp') return el('td', { textContent: p.gp });
    if (c.k.startsWith('d_')) return el('td', {}, [delta(p[c.k])]);
    if (c.k === 'flag') { const f = flagOf(p); return el('td', {}, [el('span', { class: 'chip ' + (f === 'n/a' ? 'na' : f), textContent: f })]); }
    const v = p[state.win][c.k];
    return el('td', { textContent: c.k === 'fg' ? (v * 100).toFixed(1) + '%' : v.toFixed(1) });
  }

  function detailRow(p) {
    const recent = p.rows.slice(-10).reverse();
    const head = ['Date','Opp','Result','PTS','REB','AST','3PM','STL','BLK','TOV','FG'];
    const t = el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map((h) => el('th', { textContent: h })))]),
      el('tbody', {}, recent.map((r) => el('tr', {}, [
        r.d, (r.h ? 'vs ' : '@ ') + r.o, r.r, r.pts, r.reb, r.ast, r.tpm, r.stl, r.blk, r.tov, r.fgm + '-' + r.fga,
      ].map((v) => el('td', { textContent: String(v) }))))),
    ]);
    const td = el('td', { colSpan: COLS.length }, [el('h3', { textContent: p.name + ' - recent games (newest first, up to 10)' }), t]);
    return el('tr', { class: 'detail' }, [td]);
  }

  function render() {
    const q = state.q.toLowerCase();
    let list = players.filter((p) => p.gp >= state.minGp && (!state.team || p.team === state.team) && (!q || p.name.toLowerCase().includes(q)));
    list.sort((a, b) => {
      const x = value(a, state.sort), y = value(b, state.sort);
      const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
      return (c || a.name.localeCompare(b.name)) * state.dir;
    });

    const thead = $('#tbl thead'); thead.replaceChildren();
    thead.append(el('tr', {}, COLS.map((c) => {
      const th = el('th', { class: c.trend ? 'trend' : '', textContent: c.label });
      th.setAttribute('aria-sort', state.sort === c.k ? (state.dir > 0 ? 'ascending' : 'descending') : 'none');
      if (state.sort === c.k) th.append(el('span', { class: 'arrow', textContent: state.dir > 0 ? '▲' : '▼' }));
      th.onclick = () => {
        if (state.sort === c.k) state.dir *= -1; else { state.sort = c.k; state.dir = (c.k === 'name' || c.k === 'team') ? 1 : -1; }
        render();
      };
      return th;
    })));

    const tb = $('#tbl tbody'); tb.replaceChildren();
    if (!list.length) tb.append(el('tr', {}, [el('td', { colSpan: COLS.length, class: 'empty', textContent: 'No players match.' })]));
    list.forEach((p) => {
      const tr = el('tr', { class: 'player' }, COLS.map((c) => cell(p, c)));
      tr.onclick = () => { state.open.has(p.name) ? state.open.delete(p.name) : state.open.add(p.name); render(); };
      tb.append(tr);
      if (state.open.has(p.name)) tb.append(detailRow(p));
    });

    const anyTrend = players.some((p) => p.gp >= 3);
    $('#banner').replaceChildren();
    if (!anyTrend) $('#banner').append(el('div', { class: 'note', textContent:
      'Early season: no player has 3 games yet, so Season, Last 10 and Last 5 are identical and Form shows n/a. Trends fill in as games are played.' }));
  }

  // controls
  const teams = [...new Set(players.map((p) => p.team))].sort();
  teams.forEach((t) => $('#team').append(el('option', { value: t, textContent: t })));
  $('#q').oninput = (e) => { state.q = e.target.value; render(); };
  $('#team').onchange = (e) => { state.team = e.target.value; render(); };
  $('#mingp').onchange = (e) => { state.minGp = +e.target.value; render(); };
  $('#thr').value = state.thr;
  $('#thr').oninput = (e) => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0) { state.thr = v; try { localStorage.setItem('nba_thr', String(v)); } catch (err) {} render(); }
  };
  document.querySelectorAll('#win button').forEach((b) => {
    b.onclick = () => {
      state.win = b.dataset.w;
      document.querySelectorAll('#win button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    };
  });

  $('#meta').textContent = 'Data through ' + LOG.updated + ' · ' + players.length + ' players · ' + LOG.rows.length + ' player-games · updated daily';
  render();
})();
</script>
</body>
</html>
