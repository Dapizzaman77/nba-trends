<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Player Trends</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e1e5ec;
    --accent: #1f3864; --pos: #0b7a3b; --neg: #b3261e; --posbg: #dff3e6; --negbg: #fbe3e1;
    --head: #1f3864; --headink: #ffffff; --hover: #f0f3f8; --last: #8a93a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #171c25; --ink: #e8ebf1; --muted: #98a2b3; --line: #2a3140;
      --accent: #7aa2ff; --pos: #5fd08a; --neg: #ff8a80; --posbg: #12331f; --negbg: #3a1815;
      --head: #243252; --headink: #f3f6fb; --hover: #1d2430; --last: #7d8798;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
  .controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; }
  input[type=search] { min-width: 180px; }
  input[type=number] { width: 64px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { font: inherit; color: var(--muted); background: none; border: 0; padding: 7px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--headink); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg button[aria-pressed=true] { color: #0f1218; } }
  .note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; color: var(--muted); }
  .tablebox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 76vh; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
  th, td { padding: 7px 9px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--headink); font-weight: 600;
       font-size: 12px; cursor: pointer; user-select: none; }
  th.trend { background: #4a5260; }
  th .arrow { opacity: .85; margin-left: 3px; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--card); }
  th:first-child { z-index: 3; background: var(--head); }
  tbody tr.player { cursor: pointer; }
  tbody tr.player:hover td { background: var(--hover); }
  td.name { font-weight: 600; }
  .team { color: var(--muted); font-size: 12px; }
  .pos { color: var(--pos); font-weight: 600; } .neg { color: var(--neg); font-weight: 600; } .zero { color: var(--muted); }
  .chip { display: inline-block; min-width: 62px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .chip.HOT { background: var(--posbg); color: var(--pos); } .chip.COLD { background: var(--negbg); color: var(--neg); }
  .chip.STEADY, .chip.na { color: var(--muted); border: 1px solid var(--line); }
  tr.detail td { background: var(--bg); padding: 10px 14px 14px; text-align: left; white-space: normal; }
  .detail table { min-width: 0; width: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .detail th { position: static; background: var(--head); cursor: default; }
  .detail th:first-child, .detail td:first-child { position: static; text-align: center; }
  .detail tr.lastseason td { color: var(--last); }
  .detail h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NBA Player Trends</h1>
  <p class="sub" id="meta">Loading...</p>

  <div class="controls">
    <input type="search" id="q" placeholder="Search player" aria-label="Search player">
    <label>Team <select id="team"><option value="">All</option></select></label>
    <label>Min GP this season <select id="mingp"><option>0</option><option selected>1</option><option>3</option><option>5</option><option>10</option></select></label>
    <div class="seg" role="group" aria-label="View" id="view">
      <button data-v="all" aria-pressed="true">All stats</button>
      <button data-v="stat" aria-pressed="false">By stat</button>
    </div>
    <div class="seg" role="group" aria-label="Averages window" id="win">
      <button data-w="season" aria-pressed="true">Season</button>
      <button data-w="l5" aria-pressed="false">Last 5</button>
      <button data-w="l10" aria-pressed="false">Last 10</button>
      <button data-w="l20" aria-pressed="false">Last 20</button>
    </div>
    <label id="statwrap" hidden>Stat <select id="stat"></select></label>
    <label>Hot/Cold at &plusmn; <input type="number" id="thr" min="0" step="0.5" aria-label="Hot or cold threshold in PRA"> PRA</label>
  </div>

  <div id="banner"></div>
  <div class="tablebox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <p class="foot" id="foot"></p>
</div>

<script src="data/gamelog.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const LOG = window.NBA_LOG;
  if (!LOG || !LOG.rows) { $('#meta').textContent = 'Data file not found (data/gamelog.js).'; return; }

  const SEASON_START = '2026-09-01'; // games before this date are "last season" (keep in sync with update_data.py)
  const STATS = [['pts','PTS'],['reb','REB'],['ast','AST'],['tpm','3PM'],['stl','STL'],['blk','BLK'],['tov','TOV'],['pra','PRA']];
  const STAT_OPTS = STATS.concat([['fg','FG%']]);
  const STAT_LABEL = Object.fromEntries(STAT_OPTS);
  const state = { win: 'season', view: 'all', stat: 'pts', sort: 'pts', dir: -1, q: '', team: '', minGp: 1, thr: 3, open: new Set() };
  try { const t = parseFloat(localStorage.getItem('nba_thr')); if (!isNaN(t)) state.thr = t; } catch (e) {}

  const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
  function agg(rows) {
    const o = { n: rows.length };
    STATS.forEach(([k]) => { o[k] = rows.length ? sum(rows, k) / rows.length : 0; });
    const fga = sum(rows, 'fga');
    o.fg = fga ? sum(rows, 'fgm') / fga : 0;
    return o;
  }

  const by = new Map();
  LOG.rows.forEach((r) => {
    const row = Object.assign({}, r, { pra: r.pts + r.reb + r.ast });
    if (!by.has(r.p)) by.set(r.p, []);
    by.get(r.p).push(row);
  });
  const players = [...by].map(([name, rows]) => {
    rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    const cur = rows.filter((r) => r.d >= SEASON_START);
    const p = { name, team: rows[rows.length - 1].t, gp: cur.length, total: rows.length, rows,
                season: agg(cur), l5: agg(rows.slice(-5)), l10: agg(rows.slice(-10)), l20: agg(rows.slice(-20)) };
    p.d_pts = p.l5.pts - p.l20.pts;
    p.d_pra = p.l5.pra - p.l20.pra;
    p.d_pra10 = p.l10.pra - p.l20.pra;
    return p;
  });
  const hasHistory = LOG.rows.some((r) => r.d < SEASON_START);
  const flagOf = (p) => p.total < 10 ? 'n/a' : p.d_pra >= state.thr ? 'HOT' : p.d_pra <= -state.thr ? 'COLD' : 'STEADY';
  const FLAG_ORDER = { HOT: 3, STEADY: 2, COLD: 1, 'n/a': 0 };

  const ALL_COLS = [
    { k: 'name', label: 'Player' }, { k: 'team', label: 'Team' }, { k: 'gp', label: 'GP' },
    ...STATS.map(([k, l]) => ({ k, label: l })),
    { k: 'fg', label: 'FG%' },
    { k: 'pra@l5', label: 'PRA L5', trend: true },
    { k: 'pra@l10', label: 'PRA L10', trend: true },
    { k: 'pra@l20', label: 'PRA L20', trend: true },
    { k: 'flag', label: 'Form', trend: true },
  ];
  const STAT_COLS = [
    { k: 'name', label: 'Player' }, { k: 'team', label: 'Team' }, { k: 'gp', label: 'GP' },
    { k: 'v_l5', label: 'L5' }, { k: 'v_l10', label: 'L10' }, { k: 'v_l20', label: 'L20' }, { k: 'v_season', label: 'Season' },
    { k: 'flag', label: 'Form (PRA)', trend: true },
  ];
  const cols = () => (state.view === 'all' ? ALL_COLS : STAT_COLS);

  function el(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) Object.keys(props).forEach((k) => { if (k === 'class') e.className = props[k]; else e[k] = props[k]; });
    (kids || []).forEach((c) => e.append(c));
    return e;
  }
  const fmt = (key, v) => (key === 'fg' ? (v * 100).toFixed(1) + '%' : v.toFixed(1));
  function delta(v, key, inverse) {
    const shown = key === 'fg' ? v * 100 : v;
    const r = Math.round(shown * 10) / 10;
    const good = inverse ? r < 0 : r > 0, bad = inverse ? r > 0 : r < 0;
    return el('span', { class: good ? 'pos' : bad ? 'neg' : 'zero', textContent: (r > 0 ? '+' : '') + r.toFixed(1) + (key === 'fg' ? '%' : '') });
  }

  function value(p, k) {
    if (k === 'name' || k === 'team') return p[k];
    if (k === 'gp') return p.gp;
    if (k === 'flag') return FLAG_ORDER[flagOf(p)];
    if (k.includes('@')) { const [s, w] = k.split('@'); return p[w][s]; }
    if (k.startsWith('v_')) return p[k.slice(2)][state.stat];
    return p[state.win][k];
  }

  function cell(p, c) {
    const k = c.k;
    if (k === 'name') return el('td', { class: 'name', textContent: p.name });
    if (k === 'team') return el('td', { class: 'team', textContent: p.team });
    if (k === 'gp') return el('td', { textContent: p.gp });
    if (k === 'flag') { const f = flagOf(p); return el('td', {}, [el('span', { class: 'chip ' + (f === 'n/a' ? 'na' : f), textContent: f })]); }
    if (k.includes('@')) {
      const [s, wn] = k.split('@'), w = p[wn];
      return el('td', { textContent: w.n ? fmt(s, w[s]) : '–' });
    }
    if (k.startsWith('v_')) {
      const wn = k.slice(2), w = p[wn];
      const td = el('td', { textContent: w.n ? fmt(state.stat, w[state.stat]) : '–' });
      if (w.n && (wn === 'l5' || wn === 'l10')) {
        // tint against the L20 average so the trend is visible without +/- numbers
        const d = w[state.stat] - p.l20[state.stat], eps = state.stat === 'fg' ? 0.005 : 0.05;
        const inv = state.stat === 'tov';
        if (Math.abs(d) >= eps) td.className = (d > 0) !== inv ? 'pos' : 'neg';
        td.title = 'L20 avg: ' + fmt(state.stat, p.l20[state.stat]);
      }
      return td;
    }
    const w = p[state.win];
    return el('td', { textContent: w.n ? fmt(k, w[k]) : '–' });
  }

  function detailRow(p, ncols) {
    const recent = p.rows.slice(-20).reverse();
    const head = ['Date','Opp','Result','PTS','REB','AST','PRA','3PM','STL','BLK','TOV','FG'];
    const t = el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map((h) => el('th', { textContent: h })))]),
      el('tbody', {}, recent.map((r) => el('tr', { class: r.d < SEASON_START ? 'lastseason' : '' }, [
        r.d, (r.h ? 'vs ' : '@ ') + r.o, r.r, r.pts, r.reb, r.ast, r.pra, r.tpm, r.stl, r.blk, r.tov, r.fgm + '-' + r.fga,
      ].map((v) => el('td', { textContent: String(v) }))))),
    ]);
    const td = el('td', { colSpan: ncols }, [
      el('h3', { textContent: p.name + ' - last ' + recent.length + ' games, newest first (grey rows are from last season)' }), t]);
    return el('tr', { class: 'detail' }, [td]);
  }

  function render() {
    const C = cols();
    const q = state.q.toLowerCase();
    const list = players.filter((p) => p.gp >= state.minGp && (!state.team || p.team === state.team) && (!q || p.name.toLowerCase().includes(q)));
    list.sort((a, b) => {
      const x = value(a, state.sort), y = value(b, state.sort);
      const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
      return (c || a.name.localeCompare(b.name)) * state.dir;
    });

    const thead = $('#tbl thead'); thead.replaceChildren();
    thead.append(el('tr', {}, C.map((c) => {
      const th = el('th', { class: c.trend ? 'trend' : '', textContent: c.label });
      th.setAttribute('aria-sort', state.sort === c.k ? (state.dir > 0 ? 'ascending' : 'descending') : 'none');
      if (state.sort === c.k) th.append(el('span', { class: 'arrow', textContent: state.dir > 0 ? '▲' : '▼' }));
      th.onclick = () => {
        if (state.sort === c.k) state.dir *= -1; else { state.sort = c.k; state.dir = (c.k === 'name' || c.k === 'team') ? 1 : -1; }
        render();
      };
      return th;
    })));

    const tb = $('#tbl tbody'); tb.replaceChildren();
    if (!list.length) tb.append(el('tr', {}, [el('td', { colSpan: C.length, class: 'empty', textContent: 'No players match.' })]));
    list.forEach((p) => {
      const tr = el('tr', { class: 'player' }, C.map((c) => cell(p, c)));
      tr.onclick = () => { state.open.has(p.name) ? state.open.delete(p.name) : state.open.add(p.name); render(); };
      tb.append(tr);
      if (state.open.has(p.name)) tb.append(detailRow(p, C.length));
    });

    const banner = $('#banner'); banner.replaceChildren();
    if (!hasHistory) banner.append(el('div', { class: 'note', textContent:
      'No last-season games are loaded yet, so Last 5 / 10 / 20 only include this season. Run the "Backfill last season" action once (see README) to fill them in.' }));
    else if (!players.some((p) => p.total >= 10)) banner.append(el('div', { class: 'note', textContent:
      'Form flags need at least 10 games on record per player. They appear as more games are loaded.' }));

    $('#foot').textContent = state.view === 'all'
      ? 'Averages per game over the chosen window. Season = this season only. Last 5/10/20 = a player’s most recent games, including the end of last season early in the year. PRA = points + rebounds + assists. FG% is made / attempted over the window. Form (HOT/COLD) compares PRA L5 to PRA L20. Click a player for their last 20 games.'
      : 'Showing ' + STAT_LABEL[state.stat] + ' averages per game. L5 and L10 are green when above the player’s L20 average and red when below' + (state.stat === 'tov' ? ' (for turnovers, lower is green)' : '') + '; hover a number to see the L20 average. Season = this season only; L5/L10/L20 include last season early in the year. Click a player for their last 20 games.';
  }

  // controls
  [...new Set(players.map((p) => p.team))].sort().forEach((t) => $('#team').append(el('option', { value: t, textContent: t })));
  STAT_OPTS.forEach(([k, l]) => $('#stat').append(el('option', { value: k, textContent: l })));
  $('#q').oninput = (e) => { state.q = e.target.value; render(); };
  $('#team').onchange = (e) => { state.team = e.target.value; render(); };
  $('#mingp').onchange = (e) => { state.minGp = +e.target.value; render(); };
  $('#stat').onchange = (e) => { state.stat = e.target.value; render(); };
  $('#thr').value = state.thr;
  $('#thr').oninput = (e) => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0) { state.thr = v; try { localStorage.setItem('nba_thr', String(v)); } catch (err) {} render(); }
  };
  function pressed(group, btn) { document.querySelectorAll(group + ' button').forEach((x) => x.setAttribute('aria-pressed', String(x === btn))); }
  document.querySelectorAll('#win button').forEach((b) => {
    b.onclick = () => { state.win = b.dataset.w; pressed('#win', b); render(); };
  });
  document.querySelectorAll('#view button').forEach((b) => {
    b.onclick = () => {
      state.view = b.dataset.v; pressed('#view', b);
      $('#win').hidden = state.view === 'stat';
      $('#statwrap').hidden = state.view === 'all';
      state.sort = state.view === 'all' ? 'pts' : 'v_l5'; state.dir = -1;
      render();
    };
  });

  const active = players.filter((p) => p.gp > 0).length;
  $('#meta').textContent = 'Data through ' + LOG.updated + ' · ' + active + ' players this season · ' + LOG.rows.length +
    ' player-games on record' + (hasHistory ? ' (includes last season’s final games)' : '') + ' · updated daily';
  render();
})();
</script>
</body>
</html>
