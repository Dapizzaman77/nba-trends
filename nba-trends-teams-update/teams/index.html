<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Team Trends</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5d6675; --line: #e1e5ec;
    --accent: #1f3864; --pos: #0b7a3b; --neg: #b3261e; --posbg: #dff3e6; --negbg: #fbe3e1;
    --head: #1f3864; --headink: #ffffff; --hover: #f0f3f8; --last: #8a93a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #171c25; --ink: #e8ebf1; --muted: #98a2b3; --line: #2a3140;
      --accent: #7aa2ff; --pos: #5fd08a; --neg: #ff8a80; --posbg: #12331f; --negbg: #3a1815;
      --head: #243252; --headink: #f3f6fb; --hover: #1d2430; --last: #7d8798;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 6px; }
  .nav { margin: 0 0 16px; font-size: 13px; }
  .nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .nav a:hover { text-decoration: underline; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; }
  .controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; }
  input[type=search] { min-width: 180px; }
  input[type=number] { width: 64px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { font: inherit; color: var(--muted); background: none; border: 0; padding: 7px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--headink); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg button[aria-pressed=true] { color: #0f1218; } }
  .note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; color: var(--muted); }
  .tablebox { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 76vh; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
  th, td { padding: 7px 9px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--headink); font-weight: 600;
       font-size: 12px; cursor: pointer; user-select: none; }
  th.trend { background: #4a5260; }
  th .arrow { opacity: .85; margin-left: 3px; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--card); }
  th:first-child { z-index: 3; background: var(--head); }
  tbody tr.team { cursor: pointer; }
  tbody tr.team:hover td { background: var(--hover); }
  td.name { font-weight: 600; }
  .abbr { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .pos { color: var(--pos); font-weight: 600; } .neg { color: var(--neg); font-weight: 600; }
  .chip { display: inline-block; min-width: 62px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .chip.HOT { background: var(--posbg); color: var(--pos); } .chip.COLD { background: var(--negbg); color: var(--neg); }
  .chip.STEADY, .chip.na { color: var(--muted); border: 1px solid var(--line); }
  tr.detail td { background: var(--bg); padding: 10px 14px 14px; text-align: left; white-space: normal; }
  .detail table { min-width: 0; width: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .detail th { position: static; background: var(--head); cursor: default; }
  .detail th:first-child, .detail td:first-child { position: static; text-align: center; }
  .detail tr.lastseason td { color: var(--last); }
  .detail h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NBA Team Trends</h1>
  <p class="sub" id="meta">Loading...</p>
  <p class="nav"><a href="../">&larr; Player trends</a></p>

  <div class="controls">
    <input type="search" id="q" placeholder="Search team" aria-label="Search team">
    <div class="seg" role="group" aria-label="View" id="view">
      <button data-v="all" aria-pressed="true">All stats</button>
      <button data-v="stat" aria-pressed="false">By stat</button>
    </div>
    <div class="seg" role="group" aria-label="Averages window" id="win">
      <button data-w="season" aria-pressed="true">Season</button>
      <button data-w="l5" aria-pressed="false">Last 5</button>
      <button data-w="l10" aria-pressed="false">Last 10</button>
      <button data-w="l20" aria-pressed="false">Last 20</button>
    </div>
    <label id="statwrap" hidden>Stat <select id="stat"></select></label>
    <label>Hot/Cold at &plusmn; <input type="number" id="thr" min="0" step="0.5" aria-label="Hot or cold threshold in points of margin"> pts margin</label>
  </div>

  <div id="banner"></div>
  <div class="tablebox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <p class="foot" id="foot"></p>
</div>

<script src="../data/gamelog.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const LOG = window.NBA_LOG;
  if (!LOG) { $('#meta').textContent = 'Data file not found (data/gamelog.js).'; return; }
  const RAW = LOG.teams || [];

  const SEASON_START = '2026-09-01'; // games before this date are "last season" (keep in sync with update_data.py)
  const NAMES = {
    ATL: 'Atlanta Hawks', BOS: 'Boston Celtics', BKN: 'Brooklyn Nets', CHA: 'Charlotte Hornets', CHI: 'Chicago Bulls',
    CLE: 'Cleveland Cavaliers', DAL: 'Dallas Mavericks', DEN: 'Denver Nuggets', DET: 'Detroit Pistons', GSW: 'Golden State Warriors',
    HOU: 'Houston Rockets', IND: 'Indiana Pacers', LAC: 'LA Clippers', LAL: 'Los Angeles Lakers', MEM: 'Memphis Grizzlies',
    MIA: 'Miami Heat', MIL: 'Milwaukee Bucks', MIN: 'Minnesota Timberwolves', NOP: 'New Orleans Pelicans', NYK: 'New York Knicks',
    OKC: 'Oklahoma City Thunder', ORL: 'Orlando Magic', PHI: 'Philadelphia 76ers', PHX: 'Phoenix Suns', POR: 'Portland Trail Blazers',
    SAC: 'Sacramento Kings', SAS: 'San Antonio Spurs', TOR: 'Toronto Raptors', UTA: 'Utah Jazz', WAS: 'Washington Wizards',
  };
  // k: key, label, kind: 'n' number, 'p' percent, 'm' signed margin; inv: lower is better
  const STATS = [
    { k: 'pts', label: 'PTS' }, { k: 'opp', label: 'OPP PTS', inv: true }, { k: 'mar', label: 'MARGIN', kind: 'm' },
    { k: 'reb', label: 'REB' }, { k: 'ast', label: 'AST' }, { k: 'stl', label: 'STL' }, { k: 'blk', label: 'BLK' },
    { k: 'tov', label: 'TOV', inv: true }, { k: 'tpm', label: '3PM' },
    { k: 'fg', label: 'FG%', kind: 'p' }, { k: 'tp', label: '3P%', kind: 'p' }, { k: 'ft', label: 'FT%', kind: 'p' },
  ];
  const BYK = Object.fromEntries(STATS.map((s) => [s.k, s]));
  const state = { win: 'season', view: 'all', stat: 'pts', sort: 'mar', dir: -1, q: '', thr: 3, open: new Set() };
  try { const t = parseFloat(localStorage.getItem('nba_thr_team')); if (!isNaN(t)) state.thr = t; } catch (e) {}

  const sum = (rows, k) => rows.reduce((s, r) => s + r[k], 0);
  const ratio = (a, b) => (b ? a / b : 0);
  function agg(rows) {
    const n = rows.length, o = { n };
    const avg = (k) => (n ? sum(rows, k) / n : 0);
    o.pts = avg('pf'); o.opp = avg('pa'); o.mar = o.pts - o.opp;
    ['reb', 'ast', 'stl', 'blk', 'tov', 'tpm'].forEach((k) => { o[k] = avg(k); });
    o.fg = ratio(sum(rows, 'fgm'), sum(rows, 'fga'));
    o.tp = ratio(sum(rows, 'tpm'), sum(rows, 'tpa'));
    o.ft = ratio(sum(rows, 'ftm'), sum(rows, 'fta'));
    o.w = rows.filter((r) => r.pf > r.pa).length; o.l = n - o.w;
    return o;
  }

  const by = new Map();
  RAW.forEach((r) => { if (!by.has(r.t)) by.set(r.t, []); by.get(r.t).push(r); });
  const teams = [...by].map(([abbr, rows]) => {
    rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    const cur = rows.filter((r) => r.d >= SEASON_START);
    const t = { abbr, name: NAMES[abbr] || abbr, gp: cur.length, total: rows.length, rows,
                season: agg(cur), l5: agg(rows.slice(-5)), l10: agg(rows.slice(-10)), l20: agg(rows.slice(-20)) };
    return t;
  });
  const hasHistory = RAW.some((r) => r.d < SEASON_START);
  const flagOf = (t) => {
    if (t.total < 10) return 'n/a';
    const d = t.l5.mar - t.l20.mar;
    return d >= state.thr ? 'HOT' : d <= -state.thr ? 'COLD' : 'STEADY';
  };
  const FLAG_ORDER = { HOT: 3, STEADY: 2, COLD: 1, 'n/a': 0 };

  const fmt = (s, v) => {
    if (s.kind === 'p') return (v * 100).toFixed(1) + '%';
    if (s.kind === 'm') return (v > 0 ? '+' : '') + v.toFixed(1);
    return v.toFixed(1);
  };
  const rec = (w) => w.w + '-' + w.l;

  const ALL_COLS = [
    { k: 'name', label: 'Team' }, { k: 'gp', label: 'GP' }, { k: 'rec', label: 'W-L' },
    ...STATS.map((s) => ({ k: s.k, label: s.label })),
    { k: 'mar@l5', label: 'MARGIN L5', trend: true }, { k: 'mar@l10', label: 'MARGIN L10', trend: true },
    { k: 'mar@l20', label: 'MARGIN L20', trend: true }, { k: 'flag', label: 'Form', trend: true },
  ];
  const STAT_COLS = [
    { k: 'name', label: 'Team' }, { k: 'gp', label: 'GP' }, { k: 'rec', label: 'W-L' },
    { k: 'v_l5', label: 'L5' }, { k: 'v_l10', label: 'L10' }, { k: 'v_l20', label: 'L20' }, { k: 'v_season', label: 'Season' },
    { k: 'flag', label: 'Form (margin)', trend: true },
  ];
  const cols = () => (state.view === 'all' ? ALL_COLS : STAT_COLS);

  function el(tag, props, kids) {
    const e = document.createElement(tag);
    if (props) Object.keys(props).forEach((k) => { if (k === 'class') e.className = props[k]; else e[k] = props[k]; });
    (kids || []).forEach((c) => e.append(c));
    return e;
  }

  function value(t, k) {
    if (k === 'name') return t.name;
    if (k === 'gp') return t.gp;
    if (k === 'rec') { const w = t[state.view === 'stat' ? 'season' : state.win]; return w.n ? w.w / w.n : 0; }
    if (k === 'flag') return FLAG_ORDER[flagOf(t)];
    if (k.includes('@')) { const [s, w] = k.split('@'); return t[w][s]; }
    if (k.startsWith('v_')) return t[k.slice(2)][state.stat];
    return t[state.win][k];
  }

  function cell(t, c) {
    const k = c.k;
    if (k === 'name') return el('td', { class: 'name' }, [t.name, el('span', { class: 'abbr', textContent: t.abbr })]);
    if (k === 'gp') return el('td', { textContent: t.gp });
    if (k === 'rec') { const w = t[state.view === 'stat' ? 'season' : state.win]; return el('td', { textContent: w.n ? rec(w) : '–' }); }
    if (k === 'flag') { const f = flagOf(t); return el('td', {}, [el('span', { class: 'chip ' + (f === 'n/a' ? 'na' : f), textContent: f })]); }
    if (k.includes('@')) {
      const [s, wn] = k.split('@'), w = t[wn];
      return el('td', { textContent: w.n ? fmt(BYK[s], w[s]) : '–' });
    }
    if (k.startsWith('v_')) {
      const wn = k.slice(2), w = t[wn], S = BYK[state.stat];
      const td = el('td', { textContent: w.n ? fmt(S, w[state.stat]) : '–' });
      if (w.n && (wn === 'l5' || wn === 'l10')) {
        // tint against the L20 average so the trend is visible without +/- numbers
        const d = w[state.stat] - t.l20[state.stat], eps = S.kind === 'p' ? 0.005 : 0.05;
        if (Math.abs(d) >= eps) td.className = (d > 0) !== !!S.inv ? 'pos' : 'neg';
        td.title = 'L20 avg: ' + fmt(S, t.l20[state.stat]);
      }
      return td;
    }
    const w = t[state.win];
    return el('td', { textContent: w.n ? fmt(BYK[k], w[k]) : '–' });
  }

  function detailRow(t, ncols) {
    const recent = t.rows.slice(-20).reverse();
    const head = ['Date', 'Opp', 'Result', 'PTS', 'OPP', 'MARGIN', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'FG', '3P'];
    const tbl = el('table', {}, [
      el('thead', {}, [el('tr', {}, head.map((h) => el('th', { textContent: h })))]),
      el('tbody', {}, recent.map((r) => el('tr', { class: r.d < SEASON_START ? 'lastseason' : '' }, [
        r.d, (r.h ? 'vs ' : '@ ') + r.o, r.r, r.pf, r.pa, (r.pf - r.pa > 0 ? '+' : '') + (r.pf - r.pa), r.reb, r.ast, r.stl, r.blk, r.tov,
        r.fgm + '-' + r.fga, r.tpm + '-' + r.tpa,
      ].map((v) => el('td', { textContent: String(v) }))))),
    ]);
    const td = el('td', { colSpan: ncols }, [
      el('h3', { textContent: t.name + ' - last ' + recent.length + ' games, newest first (grey rows are from last season)' }), tbl]);
    return el('tr', { class: 'detail' }, [td]);
  }

  function render() {
    const C = cols();
    const q = state.q.toLowerCase();
    const list = teams.filter((t) => !q || t.name.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q));
    list.sort((a, b) => {
      const x = value(a, state.sort), y = value(b, state.sort);
      const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
      return (c || a.name.localeCompare(b.name)) * state.dir;
    });

    const thead = $('#tbl thead'); thead.replaceChildren();
    thead.append(el('tr', {}, C.map((c) => {
      const th = el('th', { class: c.trend ? 'trend' : '', textContent: c.label });
      th.setAttribute('aria-sort', state.sort === c.k ? (state.dir > 0 ? 'ascending' : 'descending') : 'none');
      if (state.sort === c.k) th.append(el('span', { class: 'arrow', textContent: state.dir > 0 ? '▲' : '▼' }));
      th.onclick = () => {
        if (state.sort === c.k) state.dir *= -1; else { state.sort = c.k; state.dir = c.k === 'name' ? 1 : -1; }
        render();
      };
      return th;
    })));

    const tb = $('#tbl tbody'); tb.replaceChildren();
    if (!list.length) tb.append(el('tr', {}, [el('td', { colSpan: C.length, class: 'empty', textContent: teams.length ? 'No teams match.' : 'No team data yet.' })]));
    list.forEach((t) => {
      const tr = el('tr', { class: 'team' }, C.map((c) => cell(t, c)));
      tr.onclick = () => { state.open.has(t.abbr) ? state.open.delete(t.abbr) : state.open.add(t.abbr); render(); };
      tb.append(tr);
      if (state.open.has(t.abbr)) tb.append(detailRow(t, C.length));
    });

    const banner = $('#banner'); banner.replaceChildren();
    if (!teams.length) banner.append(el('div', { class: 'note', textContent:
      'No team data loaded yet. It is added by the daily update. To fill in last season too, run the "Backfill last season" action once with the end date set to today (see README).' }));
    else if (!hasHistory) banner.append(el('div', { class: 'note', textContent:
      'No last-season team games are loaded yet, so Last 5 / 10 / 20 only include this season. Run the "Backfill last season" action once with the end date set to today (see README).' }));
    else if (!teams.some((t) => t.total >= 10)) banner.append(el('div', { class: 'note', textContent:
      'Form flags need at least 10 games on record per team. They appear as more games are loaded.' }));

    const S = BYK[state.stat];
    $('#foot').textContent = state.view === 'all'
      ? 'Per-game averages over the chosen window. Season = this season only; Last 5/10/20 = a team’s most recent games, including the end of last season early in the year. MARGIN = points scored minus points allowed. W-L is the record in the chosen window. Form (HOT/COLD) compares average margin over the last 5 games with the last 20. Click a team for its last 20 games.'
      : 'Showing ' + S.label + (S.kind === 'p' ? ' (made / attempted over the window)' : ' per game') + '. L5 and L10 are green when better than the team’s L20 average and red when worse' + (S.inv ? ' (lower is better for this stat)' : '') + '; hover a number to see the L20 average. Season = this season only. Click a team for its last 20 games.';
  }

  // controls
  STATS.forEach((s) => $('#stat').append(el('option', { value: s.k, textContent: s.label })));
  $('#q').oninput = (e) => { state.q = e.target.value; render(); };
  $('#stat').onchange = (e) => { state.stat = e.target.value; render(); };
  $('#thr').value = state.thr;
  $('#thr').oninput = (e) => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0) { state.thr = v; try { localStorage.setItem('nba_thr_team', String(v)); } catch (err) {} render(); }
  };
  function pressed(group, btn) { document.querySelectorAll(group + ' button').forEach((x) => x.setAttribute('aria-pressed', String(x === btn))); }
  document.querySelectorAll('#win button').forEach((b) => {
    b.onclick = () => { state.win = b.dataset.w; pressed('#win', b); render(); };
  });
  document.querySelectorAll('#view button').forEach((b) => {
    b.onclick = () => {
      state.view = b.dataset.v; pressed('#view', b);
      $('#win').hidden = state.view === 'stat';
      $('#statwrap').hidden = state.view === 'all';
      state.sort = state.view === 'all' ? 'mar' : 'v_l5'; state.dir = -1;
      render();
    };
  });

  $('#meta').textContent = 'Data through ' + LOG.updated + ' · ' + teams.length + ' teams · ' + RAW.length +
    ' team-games on record' + (hasHistory ? ' (includes last season’s final games)' : '') + ' · updated daily';
  render();
})();
</script>
</body>
</html>
